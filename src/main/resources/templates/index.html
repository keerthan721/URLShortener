<!DOCTYPE html>
<html>
<head>
    <title>Smart URL Shortener</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
            color: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: fadeIn 1s ease-in-out;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
        }

        button {
            margin-top: 15px;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 10px;
            background: #ffffff;
            color: #764ba2;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        #result {
            margin-top: 20px;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<div class="card">
    <h2>🚀 Smart URL Shortener</h2>

    <input type="text" id="urlInput" placeholder="Paste your long URL here...">
    <button onclick="shortenUrl()">Generate Short URL</button>

    <div id="result"></div>
    <div style="margin-top:20px;">
    <a href="/admin">
        <button style="
            background: transparent;
            border: 2px solid white;
            color: white;
        ">
            📊 View Admin Dashboard
        </button>
    </a>
</div>

</div>

<script>
    function shortenUrl() {
        const url = document.getElementById("urlInput").value;

        fetch("/shorten", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: "url=" + encodeURIComponent(url)
        })
        .then(response => response.text())
        .then(data => {
            document.getElementById("result").innerHTML =
                "<b>Short URL:</b><br><a href='" + data + "' target='_blank' style='color:yellow'>" + data + "</a>";
        });
    }
</script>

</body>
</html>
