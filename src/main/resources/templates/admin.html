<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #141E30, #243B55);
            color: white;
        }

        .container {
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            width: 200px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background: rgba(0,0,0,0.3);
        }

        tr:hover {
            background: rgba(255,255,255,0.1);
        }

        a {
            color: #00ffcc;
            text-decoration: none;
        }

        button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #00ffcc;
            color: black;
        }

        .top-link {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📊 URL Analytics Dashboard</h1>

    <div class="stats">
        <div class="card">
            <h3>Total Links</h3>
            <p th:text="${totalLinks}"></p>
        </div>

        <div class="card">
            <h3>Total Clicks</h3>
            <p th:text="${totalClicks}"></p>
        </div>
    </div>

    <div class="top-link">
        <a href="/">⬅ Back to Home</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Short URL</th>
                <th>Original URL</th>
                <th>Clicks</th>
                <th>Created</th>
                <th>Copy</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="url : ${urls}">
                <td th:text="${url.id}"></td>
                <td>
                    <a th:href="@{'/' + ${url.shortCode}}"
                       th:text="'/' + ${url.shortCode}"
                       target="_blank"></a>
                </td>
                <td th:text="${url.originalUrl}"></td>
                <td th:text="${url.clickCount}"></td>
                <td th:text="${url.createdAt}"></td>
                <td>
                    <button th:attr="onclick=|copyToClipboard('http://localhost:8080/${url.shortCode}')|">
                        Copy
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

</div>

<script>
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        alert("Copied: " + text);
    }
</script>

</body>
</html>
